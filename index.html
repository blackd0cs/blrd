<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>blrd ai — UI preview</title>
<style>
:root{
  --bg:#000; --surface:#121212; --surface-2:#1c1c1e; --bubble:#1b1b1d;
  --text:#f2f2f2; --dim:#8e8e93; --dim-2:#5a5a5e;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:"Google Sans","Google Sans Text","Product Sans",Inter,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;letter-spacing:-.012em;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.frame{position:relative;height:100%;width:100%;overflow:hidden;background:#000}
@media (min-width:900px){
  body{display:grid;place-items:center;background:#07070a}
  .frame{width:420px;height:min(900px,96vh);border-radius:38px;border:1px solid #1e1e22;
    box-shadow:0 40px 120px rgba(0,0,0,.8)}
}

/* ============ угасание контента в цвет фона ============ */
.fade{position:absolute;left:0;right:0;z-index:20;pointer-events:none}
/* размытие, которое само затухает: маска гасит blur-слой, а не режет его кромкой */
.fade::before{
  content:"";position:absolute;inset:0;
  backdrop-filter:blur(16px) saturate(135%);
  -webkit-backdrop-filter:blur(16px) saturate(135%);
  -webkit-mask-image:linear-gradient(var(--dir),
    #000 0%, rgba(0,0,0,.96) 22%, rgba(0,0,0,.78) 42%, rgba(0,0,0,.5) 60%,
    rgba(0,0,0,.24) 76%, rgba(0,0,0,.07) 90%, transparent 100%);
  mask-image:linear-gradient(var(--dir),
    #000 0%, rgba(0,0,0,.96) 22%, rgba(0,0,0,.78) 42%, rgba(0,0,0,.5) 60%,
    rgba(0,0,0,.24) 76%, rgba(0,0,0,.07) 90%, transparent 100%);
}
/* заливка: много стопов, иначе на градиенте видна полоса */
.fade::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(var(--dir),
    rgba(0,0,0,1) 0%,    rgba(0,0,0,.99) 12%,  rgba(0,0,0,.96) 24%,
    rgba(0,0,0,.90) 35%, rgba(0,0,0,.80) 45%,  rgba(0,0,0,.66) 55%,
    rgba(0,0,0,.49) 65%, rgba(0,0,0,.31) 76%,  rgba(0,0,0,.16) 86%,
    rgba(0,0,0,.05) 94%, rgba(0,0,0,0) 100%);
}
.fade.top{--dir:180deg;top:0;height:calc(var(--safe-top) + 124px)}
.fade.bottom{--dir:0deg;bottom:0;height:calc(var(--safe-bottom) + 168px)}

/* ============ header ============ */
.header{
  position:absolute;top:0;left:0;right:0;z-index:30;
  padding:calc(var(--safe-top) + 12px) 12px 10px;
  display:flex;align-items:center;gap:10px;
}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface-2);transition:transform .12s ease,background .16s ease;flex:none}
.icon-btn:active{transform:scale(.9);background:#262628}
.header-center{flex:1;display:flex;justify-content:center;min-width:0}
.model-pill{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:14px;
  font-size:19px;font-weight:600;letter-spacing:-.025em;max-width:100%}
.model-pill .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-pill .plan{color:var(--dim);font-weight:600}
.model-pill .chev{opacity:.5;transition:transform .22s ease;flex:none}
.model-pill.open .chev{transform:rotate(180deg)}
.model-pill:active{opacity:.6}
.header-right{display:flex;align-items:center;gap:6px;background:var(--surface-2);
  border-radius:999px;padding:4px 4px 4px 6px;flex:none}
.header-right .icon-btn{background:none;width:36px;height:36px}
.header-right .icon-btn:active{background:rgba(255,255,255,.07)}
.avatar{width:38px;height:38px;border-radius:50%;padding:2.5px;flex:none;
  background:conic-gradient(from 210deg,#2f7bff,#6a5cff,#b14bff,#2f7bff);display:grid;place-items:center}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}

/* ============ messages ============ */
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-top) + 84px) 16px calc(var(--safe-bottom) + 124px)}
.msg{margin:20px 0;animation:rise .3s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .col{max-width:88%;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.bubble{background:var(--bubble);border-radius:22px;padding:14px 18px;white-space:pre-wrap;word-break:break-word}
.body>:first-child{margin-top:0}
.body>:last-child{margin-bottom:0}
.body p{margin:0 0 14px}
.body strong{font-weight:700}
.body em{font-style:italic}
.body ul,.body ol{margin:0 0 14px;padding-left:24px}
.body li{margin:7px 0}
.body h3{font-size:19px;font-weight:700;margin:20px 0 10px;letter-spacing:-.025em}
.body a{color:#4f9dff;text-decoration:none}
.body hr{border:0;border-top:1px solid #1f1f22;margin:18px 0}
.body blockquote{margin:0 0 14px;padding:2px 0 2px 14px;border-left:2px solid #2c2c2e;color:#b9b9bd}
.body table{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 14px;font-size:15px;
  border:1px solid #1f1f22;border-radius:14px;overflow:hidden}
.body th,.body td{padding:10px 12px;text-align:left;border-bottom:1px solid #1a1a1d}
.body th{background:#121214;font-weight:600;font-size:14px;color:#cfcfd2}
.body tr:last-child td{border-bottom:0}
code.inline{background:#1c1c1e;border-radius:6px;padding:2px 6px;font-size:14.5px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace}
.body pre{background:#0d0d0f;border:1px solid #1f1f22;border-radius:16px;margin:0 0 14px;overflow:hidden}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
  border-bottom:1px solid #1a1a1d;font-size:12.5px;color:var(--dim);letter-spacing:.02em}
.code-head button{font-size:12.5px;color:var(--dim)}
.code-head button:active{color:#fff}
.body pre code{display:block;padding:13px;overflow-x:auto;font-size:13.5px;line-height:1.6;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#e6e6e8;white-space:pre}
.caret{display:inline-block;width:8px;height:17px;background:#f2f2f2;border-radius:2px;
  vertical-align:-2px;margin-left:3px;animation:bl .9s steps(2,start) infinite}
@keyframes bl{50%{opacity:0}}
.atts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.atts .ph{width:124px;height:124px;border-radius:18px;object-fit:cover}
.chip{display:flex;align-items:center;gap:9px;background:var(--surface-2);border-radius:14px;
  padding:11px 14px;font-size:14.5px;max-width:230px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typing{display:inline-flex;gap:5px;align-items:center;height:24px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:bk 1.3s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes bk{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 30px}
.empty h1{font-size:32px;font-weight:700;letter-spacing:-.035em;margin:0 0 8px}
.empty p{color:var(--dim);margin:0;font-size:16px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.sugg button{background:var(--surface-2);border-radius:16px;padding:10px 15px;font-size:14.5px;color:#d4d4d6}
.sugg button:active{transform:scale(.96)}

/* ============ composer ============ */
.composer{position:absolute;left:0;right:0;bottom:0;z-index:30;
  padding:10px 14px calc(var(--safe-bottom) + 14px)}
.pending{display:flex;gap:8px;padding:0 6px 9px;overflow-x:auto}
.pending .th{position:relative;flex:none}
.pending .th img{width:58px;height:58px;border-radius:13px;object-fit:cover;display:block}
.pending .rm{position:absolute;top:-6px;right:-6px;width:21px;height:21px;border-radius:50%;
  background:#303034;display:grid;place-items:center;font-size:11px;border:2px solid #000}
/* высота строки textarea = 44px = высоте кнопок, поэтому ничего не съезжает */
.c-inner{display:flex;align-items:flex-end;gap:6px;border-radius:27px;padding:5px;
  background:rgba(34,34,36,.8);border:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.c-inner textarea{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);
  resize:none;font:inherit;display:block;min-height:44px;max-height:132px;
  padding:11px 6px;line-height:22px;overflow-y:auto}
.c-inner textarea::placeholder{color:var(--dim)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.09);transition:transform .12s,background .16s,opacity .16s}
.round:active{transform:scale(.88)}
.round svg{display:block}
.round.send{background:#f2f2f2;color:#000}
.round.send[disabled]{background:rgba(255,255,255,.09);color:var(--dim);opacity:.6;cursor:default}

/* ============ sidebar ============ */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.5);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .3s ease}
.scrim.show{opacity:1;pointer-events:auto}
.sidebar{position:absolute;inset:0;z-index:50;background:#0a0a0a;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .34s cubic-bezier(.3,.9,.3,1)}
.sidebar.open{transform:none}
.sb-top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 18px) 18px 4px}
.sb-top h2{font-size:28px;font-weight:700;letter-spacing:-.035em;margin:0}
.sb-act{display:flex;align-items:center;gap:16px;padding:16px 20px;font-size:19px;font-weight:500;width:100%;text-align:left}
.sb-act:active{opacity:.55}
.sb-label{padding:14px 20px 6px;color:var(--dim);font-size:17px;font-weight:500}
.chats{flex:1;overflow-y:auto;padding:0 8px 170px;
  -webkit-mask-image:linear-gradient(180deg,#000 58%,rgba(0,0,0,.82) 70%,rgba(0,0,0,.45) 82%,rgba(0,0,0,.14) 92%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 58%,rgba(0,0,0,.82) 70%,rgba(0,0,0,.45) 82%,rgba(0,0,0,.14) 92%,transparent 100%)}
.chat-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:13px 12px;border-radius:14px;font-size:18px;letter-spacing:-.015em;transition:background .15s}
.chat-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item.active{background:#141416}
.chat-item:active{background:#18181a}
.chat-item .del{opacity:0;color:var(--dim);padding:6px;border-radius:8px;transition:opacity .15s;display:grid;place-items:center}
.chat-item.active .del{opacity:.75}
@media(hover:hover){.chat-item:hover .del{opacity:.75}}
.sb-foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;
  padding:14px 18px calc(var(--safe-bottom) + 18px)}
.sb-foot::before{
  content:"";position:absolute;inset:-60px 0 0;z-index:-1;pointer-events:none;
  background:linear-gradient(0deg,
    rgba(10,10,10,1) 0%,    rgba(10,10,10,.99) 20%, rgba(10,10,10,.95) 33%,
    rgba(10,10,10,.86) 45%, rgba(10,10,10,.70) 57%, rgba(10,10,10,.50) 68%,
    rgba(10,10,10,.29) 79%, rgba(10,10,10,.12) 90%, rgba(10,10,10,0) 100%);
  -webkit-mask-image:linear-gradient(0deg,#000 0%,#000 30%,rgba(0,0,0,.5) 62%,transparent 100%);
  mask-image:linear-gradient(0deg,#000 0%,#000 30%,rgba(0,0,0,.5) 62%,transparent 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.sb-foot .avatar{width:46px;height:46px}
.sb-foot .name{font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.sb-foot .plan{font-size:15px;color:var(--dim)}

/* ============ sheets ============ */
.sheet-wrap{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.52);
  backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:relative;width:100%;background:rgba(18,18,20,.97);border-radius:26px 26px 0 0;
  border-top:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  padding:8px 10px calc(var(--safe-bottom) + 14px);max-height:80%;overflow-y:auto;
  animation:up .34s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(102%)}to{transform:none}}
.handle{width:36px;height:4px;border-radius:2px;background:#303034;margin:6px auto 14px}
.sheet h3{margin:0 10px 8px;font-size:12.5px;color:var(--dim);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em}
.m-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border-radius:16px;text-align:left}
.m-row:active{background:#1b1b1e}
.m-row.sel{background:#1b1b1e}
.m-row .meta{flex:1;min-width:0}
.m-row .nm{font-size:17px;font-weight:600;letter-spacing:-.015em}
.m-row .sub{font-size:14px;color:var(--dim);margin-top:1px}
.m-row.locked{opacity:.52}
.tag{font-size:11.5px;font-weight:700;color:#000;background:#f2f2f2;border-radius:8px;padding:3px 7px;letter-spacing:.02em}
.energy{font-size:13.5px;color:var(--dim-2);text-align:center;padding:10px 0 2px}
.demo{display:flex;justify-content:center;padding:6px 0 0}
.demo button{font-size:13px;color:#4f9dff;padding:8px 12px}
.paywall{padding:18px 16px 6px}
.paywall h2{font-size:27px;font-weight:700;letter-spacing:-.035em;margin:0}
.paywall .price{font-size:42px;font-weight:700;letter-spacing:-.04em;margin:16px 0 0}
.paywall .per{color:var(--dim);font-size:15px}
.paywall ul{list-style:none;padding:0;margin:18px 0 22px}
.paywall li{display:flex;gap:11px;padding:7px 0;color:#d6d6d8;font-size:16px}
.paywall li svg{flex:none;margin-top:4px;color:#f2f2f2}
.cta{width:100%;background:#f2f2f2;color:#000;border-radius:18px;padding:16px;
  font-size:17px;font-weight:600;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta.ghost{background:rgba(255,255,255,.09);color:var(--text)}
.promo{display:flex;gap:8px;margin-top:10px}
.promo input{flex:1;min-width:0;background:#1c1c1e;border:0;outline:none;color:var(--text);
  border-radius:16px;padding:15px;font:inherit;letter-spacing:.04em}
.promo input::placeholder{letter-spacing:0;color:var(--dim)}
.promo .cta{width:auto;padding:15px 18px}
.hint{color:var(--dim-2);font-size:13.5px;text-align:center;margin-top:12px}
.toast{position:absolute;left:50%;bottom:calc(var(--safe-bottom) + 100px);transform:translateX(-50%);
  background:rgba(38,38,40,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:14px;padding:12px 16px;font-size:15px;z-index:80;max-width:86%;text-align:center;
  animation:rise .26s ease;box-shadow:0 10px 40px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="scroll" id="scroll"></div>

  <div class="fade top"></div>
  <div class="fade bottom"></div>

  <header class="header">
    <button class="icon-btn" id="burger" aria-label="Меню">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="header-center">
      <button class="model-pill" id="pill">
        <span class="nm" id="pill-name">blrd 4.7</span>
        <span class="plan" id="pill-plan">Pro</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5.5l4 4 4-4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="new-top" aria-label="Новый чат">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4.5 19.5h3.6L20 7.6a2.55 2.55 0 00-3.6-3.6L4.5 15.9v3.6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <div class="avatar" id="av-top"><img alt="" /></div>
    </div>
  </header>

  <div class="composer">
    <div class="pending" id="pending" hidden></div>
    <div class="c-inner">
      <button class="round" id="attach" aria-label="Прикрепить">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 4.5v13M4.5 11h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <textarea id="ta" rows="1" placeholder="Введите запрос"></textarea>
      <!-- data-haptic="off": у кнопки два смысла, отклик задаётся вручную -->
      <button class="round send" id="send" data-haptic="off" disabled aria-label="Отправить"></button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <h2>blrd ai</h2>
      <button class="icon-btn" id="close-sb" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button class="sb-act" id="new-side">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M4.5 19.5h3.6L20 7.6a2.55 2.55 0 00-3.6-3.6L4.5 15.9v3.6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Новый чат
    </button>
    <div class="sb-label">Все чаты</div>
    <div class="chats" id="chats"></div>
    <div class="sb-foot">
      <div class="avatar" id="av-side"><img alt="" /></div>
      <div>
        <div class="name" id="u-name">My Name</div>
        <div class="plan" id="u-plan">Pro</div>
      </div>
    </div>
  </aside>

  <div id="layer"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;

/* ===================== виброотклик ===================== */
/* В Telegram идёт в нативный HapticFeedback (Bot API 6.1+).
   Вне Telegram — fallback на navigator.vibrate (Android Chrome).
   На десктопе и в iOS Safari вибрации нет физически, вызовы просто молчат. */
const Haptic = (() => {
  const hf = tg?.HapticFeedback;
  const tgOK = !!(hf && typeof hf.impactOccurred === "function");
  const vibOK = !tgOK && typeof navigator.vibrate === "function";
  let last = 0, on = true;

  /* impact-события глушим на 45 мс: Telegram игнорирует частые вызовы и ломает ритм */
  const fire = (native, pattern, force) => {
    if (!on) return;
    const now = performance.now();
    if (!force && now - last < 45) return;
    last = now;
    try { if (tgOK) native(); else if (vibOK) navigator.vibrate(pattern); } catch (e) {}
  };

  return {
    get enabled(){ return on },
    set enabled(v){ on = !!v },
    /* короткие касания */
    tap:    () => fire(() => hf.impactOccurred("light"),  8),
    press:  () => fire(() => hf.impactOccurred("medium"), 16),
    heavy:  () => fire(() => hf.impactOccurred("heavy"),  26),
    soft:   () => fire(() => hf.impactOccurred("soft"),   6),
    rigid:  () => fire(() => hf.impactOccurred("rigid"),  11),
    /* смена выбора в списке */
    select: () => fire(() => (hf.selectionChanged ? hf.selectionChanged() : hf.impactOccurred("light")), 5),
    /* уведомления: не глушатся, чтобы не терялись после тапа */
    ok:     () => fire(() => hf.notificationOccurred("success"), [11, 45, 22], true),
    warn:   () => fire(() => hf.notificationOccurred("warning"), [16, 55, 16], true),
    err:    () => fire(() => hf.notificationOccurred("error"),   [22, 55, 22, 55, 22], true)
  };
})();

/* ===================== markdown ===================== */
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

function inline(t){
  return t
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    /* без lookbehind: старые WebView в Telegram на нём падали целиком */
    .replace(/(^|[\s(])\*([^\s*][^*]*?)\*(?=$|[\s.,!?)])/g, "$1<em>$2</em>")
    .replace(/~~(.+?)~~/g, "<s>$1</s>");
}

function renderMD(src){
  const stash = [];
  let t = String(src).replace(/```([^\n`]*)\n([\s\S]*?)(?:```|$)/g, (m, lang, body) => {
    stash.push(`<pre><div class="code-head"><span>${esc(lang.trim() || "code")}</span>`
      + `<button onclick="copyCode(this)">Копировать</button></div>`
      + `<code>${esc(body.replace(/\n+$/, ""))}</code></pre>`);
    return `\u0000${stash.length - 1}\u0000`;
  });
  t = t.replace(/`([^`\n]+)`/g, (m, c) => {
    stash.push(`<code class="inline">${esc(c)}</code>`);
    return `\u0000${stash.length - 1}\u0000`;
  });
  t = esc(t);

  const lines = t.split("\n");
  let out = "", para = [], list = null, table = null;
  const flushP = () => { if (para.length) { out += `<p>${inline(para.join("<br>"))}</p>`; para = []; } };
  const flushL = () => { if (list) { out += `<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`; list = null; } };
  const flushT = () => {
    if (!table) return;
    const row = (cells, tag) => `<tr>${cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join("")}</tr>`;
    out += `<table><thead>${row(table.head, "th")}</thead><tbody>${table.rows.map(r => row(r, "td")).join("")}</tbody></table>`;
    table = null;
  };
  const flushAll = () => { flushP(); flushL(); flushT(); };
  const cells = l => l.replace(/^\||\|$/g, "").split("|").map(c => c.trim());

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i], tr = l.trim();
    if (!tr) { flushAll(); continue; }
    if (/^\u0000\d+\u0000$/.test(tr)) { flushAll(); out += stash[+tr.slice(1, -1)]; continue; }
    if (/^#{1,6}\s/.test(tr)) { flushAll(); out += `<h3>${inline(tr.replace(/^#{1,6}\s*/, ""))}</h3>`; continue; }
    if (/^(---|\*\*\*|___)$/.test(tr)) { flushAll(); out += "<hr>"; continue; }
    if (/^&gt;\s?/.test(tr)) { flushAll(); out += `<blockquote>${inline(tr.replace(/^&gt;\s?/, ""))}</blockquote>`; continue; }
    if (tr.startsWith("|") && /^\|[\s:|-]+\|$/.test((lines[i + 1] || "").trim())) {
      flushAll(); table = { head:cells(tr), rows:[] }; i++; continue;
    }
    if (table && tr.startsWith("|")) { table.rows.push(cells(tr)); continue; }
    flushT();
    const ul = tr.match(/^[-*+]\s+(.*)$/), ol = tr.match(/^\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? "ul" : "ol";
      flushP();
      if (!list || list.tag !== tag) { flushL(); list = { tag, items:[] }; }
      list.items.push((ul || ol)[1]);
      continue;
    }
    flushL(); para.push(tr);
  }
  flushAll();
  for (let i = 0; i < stash.length; i++) out = out.split(`\u0000${i}\u0000`).join(stash[i]);
  return out;
}

function copyCode(btn){
  const code = btn.closest("pre").querySelector("code").textContent;
  const done = () => {
    Haptic.ok();
    btn.textContent = "Скопировано";
    setTimeout(() => (btn.textContent = "Копировать"), 1600);
  };
  const fail = () => { Haptic.err(); toast("Буфер недоступен в этом окружении"); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(code).then(done).catch(fail);
  else fail();
}

      if (chat()) chat().model = m.path;
      closeSheet(); renderHeader();
      if (!chat()?.messages.length) renderChat(true);
      toast("Модель: " + m.name);
    };
  });
}
$("pill").onclick = () => ($("layer").querySelector(".sheet") ? closeSheet() : modelSheet());

function paywall(){
  $("layer").innerHTML = `<div class="sheet-wrap"><div class="sheet-bg" data-close></div>
    <div class="sheet"><div class="handle"></div>
      <div class="paywall">
        <h2>blrd ai Pro</h2>
        <div class="price">150 ₽</div>
        <div class="per">в месяц, без автосписаний</div>
        <ul>
          <li>${ICON_CHECK}<span>Все модели, включая blrd 4.7 и Opus 5</span></li>
          <li>${ICON_CHECK}<span>1 000 энергии каждый месяц</span></li>
          <li>${ICON_CHECK}<span>Картинки и файлы в запросах</span></li>
          <li>${ICON_CHECK}<span>Длинный контекст диалога</span></li>
        </ul>
        <button class="cta" data-pay>Оформить Pro</button>
        <div class="promo">
          <input id="promo" placeholder="Промокод" autocapitalize="characters" />
          <button class="cta ghost" data-promo>Применить</button>
        </div>
        <div class="hint">Демо: промокод <b>TESTPRO</b> включает Pro. Сейчас: ${state.user.plan === "pro" ? "Pro" : "Free"} · ${state.user.energy} энергии</div>
      </div></div></div>`;

  $("layer").querySelector("[data-close]").onclick = () => { Haptic.tap(); closeSheet(); };
  $("layer").querySelector("[data-pay]").onclick = e => {
    e.currentTarget.textContent = "Создаём платёж…";
    setTimeout(() => { Haptic.rigid(); closeSheet(); toast("Здесь откроется страница оплаты platega.io"); }, 900);
  };
  $("layer").querySelector("[data-promo]").onclick = () => {
    const v = $("promo").value.trim().toUpperCase();
    if (v === "TESTPRO") {
      state.user.plan = "pro"; state.user.energyMax = 1000; state.user.energy = 1000;
      renderHeader(); closeSheet(); Haptic.ok(); toast("Pro активирован на 30 дней");
    } else { Haptic.err(); toast(v ? "Промокод не найден" : "Введите промокод"); }
  };
  $("promo").oninput = e => e.target.value = e.target.value.toUpperCase();
}

/* ===================== новый чат ===================== */
function newChat(){
  if (state.busy) finishStream(true, true);
  const id = Math.max(0, ...state.chats.map(c => c.id)) + 1;
  state.chats.unshift({ id, title:"Новый чат", model:state.modelPath, messages:[] });
  state.chatId = id;
  state.pending = []; renderPending();
  closeSidebar(); renderChats(); renderChat(true); syncSend();
}
$("new-top").onclick = newChat;
$("new-side").onclick = newChat;
$("av-top").onclick = () => {};   /* по ТЗ аватар ничего не открывает */

/* ===================== вложения ===================== */
$("attach").onclick = () => {
  if (state.user.plan !== "pro") { Haptic.err(); paywall(); toast("Вложения доступны в Pro"); return; }
  const n = state.pending.length;
  state.pending.push(n % 2 === 0
    ? { kind:"image", name:"photo_" + (n + 1) + ".jpg" }
    : { kind:"doc", name:"unit-economics.pdf" });
  renderPending(); syncSend();
};

/* ===================== отправка и мок-стрим ===================== */
const ta = $("ta");
let stream = null;

function syncSend(){
  const b = $("send");
  if (state.busy) { b.disabled = false; return; }
  b.disabled = !(ta.value.trim() || state.pending.length);
}
function setSendMode(mode){
  const b = $("send");
  b.classList.toggle("send", mode === "send");
  b.innerHTML = mode === "send" ? ICON_UP : ICON_STOP;
  b.setAttribute("aria-label", mode === "send" ? "Отправить" : "Остановить");
}
$("send").onclick = () => (state.busy ? finishStream(true) : send());

ta.addEventListener("input", () => {
  const before = ta.style.height;
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 132) + "px";
  /* поле выросло на строку — лёгкая отметка, как в нативных мессенджерах */
  if (before && before !== ta.style.height) Haptic.soft();
  syncSend();
});
ta.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 900) { e.preventDefault(); send(); }
});

function pickReply(q){
  const s = q.toLowerCase();
  if (s.includes("акул")) return SHARK_A;
  if (/код|python|функци|миграц|токен/.test(s)) return REPLIES[1];
  if (/эконом|считай|посчитай|маржа|подписк/.test(s)) return REPLIES[0];
  return REPLIES[2];
}

/* стрим пишет в чат, зафиксированный на момент отправки, даже если пользователь ушёл в другой */
function finishStream(aborted, silent){
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  const s = stream; stream = null;
  state.busy = false;
  setSendMode("send");
  if (s) {
    const txt = s.full.slice(0, s.i);
    if (txt.trim()) s.target.messages.push({ role:"assistant", content:txt });
    if (s.fresh && s.newTitle) { s.target.title = s.newTitle; renderChats(); }
    const m = state.models.find(x => x.path === s.modelPath) || model();
    if (m.mult) state.user.energy = Math.max(0, state.user.energy - Math.max(1, Math.round(txt.length / 90 * m.mult)));
  }
  renderHeader(); renderChat(); syncSend();
  if (silent) return;
  aborted ? Haptic.warn() : Haptic.ok();
}

function send(){
  const text = ta.value.trim();
  if ((!text && !state.pending.length) || state.busy) return;
  if (!chat()) newChat();

  const target = chat();
  const m = model();
  if (m.mult > 0 && state.user.energy < 1) { Haptic.err(); paywall(); toast("Закончилась энергия"); return; }

  Haptic.press();
  const atts = state.pending.slice();
  const fresh = target.title === "Новый чат";
  target.messages.push({ role:"user", content:text, atts });
  ta.value = ""; ta.style.height = "auto";
  state.pending = []; renderPending();
  state.busy = true; setSendMode("stop"); syncSend();
  stick = true;
  renderChat(true);

  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
  $("scroll").appendChild(wrap);
  toBottom(true);

  stream = {
    target, wrap, i:0, modelPath:m.path, fresh, hinted:false,
    newTitle:(text.slice(0, 38) || (atts.length ? "Файлы и картинки" : "Новый чат")),
    full: atts.some(a => a.kind === "image") ? PHOTO_REPLY : pickReply(text)
  };
  const s = stream;

  setTimeout(() => {
    if (stream !== s) return;
    state.timer = setInterval(() => {
      if (stream !== s) { clearInterval(state.timer); state.timer = null; return; }
      s.i += 3 + Math.floor(Math.random() * 7);
      /* первый токен: отметка, что модель начала отвечать */
      if (!s.hinted) { s.hinted = true; Haptic.soft(); }
      const part = s.full.slice(0, s.i);
      const safe = (part.match(/```/g) || []).length % 2 ? part + "\n```" : part;
      s.wrap.innerHTML = `<div class="body">${renderMD(safe)}<span class="caret"></span></div>`;
      toBottom();
      if (s.i >= s.full.length) { s.i = s.full.length; finishStream(false); }
    }, 28);
  }, 620);
}

/* ===================== старт ===================== */
tg?.ready(); tg?.expand();
tg?.setHeaderColor?.("#000000"); tg?.setBackgroundColor?.("#000000");
tg?.disableVerticalSwipes?.();
if (tg?.initDataUnsafe?.user) {
  const u = tg.initDataUnsafe.user;
  state.user.name = [u.first_name, u.last_name].filter(Boolean).join(" ") || u.username || "My Name";
}
setSendMode("send");
seed(); renderHeader(); renderChats(); renderChat(true); renderPending(); syncSend();
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("layer").innerHTML) closeSheet();
  else if (state.sidebar) closeSidebar();
});
</script>
</body>
